[project]
name = "aitaskbase"
version = "0.1.0"
description = ""
authors = [
    {name = "TFFCompany",email = "nik.tiun@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "torch (>=2.9.1,<3.0.0)",
    "transformers (>=4.57.3,<5.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
    "mlflow (>=3.8.1,<4.0.0)",
    "boto3 (>=1.42.19,<2.0.0)"
]

[tool.poetry]
packages = [{include = "aitaskbase", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
